name: GAM Line Item Copier

run-name: "GAM Copier | ${{ inputs.requested_by }} | ${{ inputs.source_codes }} -> ${{ inputs.target_codes }}"

on:
  workflow_dispatch:
    inputs:
      source_codes:
        description: "Códigos das linhas de ORIGEM, na ordem"
        required: true
        type: string
      target_codes:
        description: "Códigos das linhas de DESTINO, na mesma ordem"
        required: true
        type: string
      requested_by:
        description: "Usuário autenticado que solicitou a cópia"
        required: false
        type: string
        default: "GITHUB"
      allow_inverted:
        description: "Confirmação explícita para origem posterior ao destino"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  copiar-line-items:
    name: "Cópia solicitada por ${{ inputs.requested_by }}"
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Registrar solicitacao
        env:
          REQUESTED_BY: ${{ inputs.requested_by }}
          SOURCE_CODES: ${{ inputs.source_codes }}
          TARGET_CODES: ${{ inputs.target_codes }}
          ALLOW_INVERTED: ${{ inputs.allow_inverted }}
        run: |
          {
            echo "## Solicitação GAM Line Item Copier"
            echo ""
            echo "- **Solicitado por:** ${REQUESTED_BY}"
            echo "- **Origens:** ${SOURCE_CODES}"
            echo "- **Destinos:** ${TARGET_CODES}"
            echo "- **Rede GAM:** 95377733"
            echo "- **Inversão confirmada:** ${ALLOW_INVERTED}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gam-api-user-de-para@gam-lineitem-copier.iam.gserviceaccount.com

      - name: Bloquear possível inversão de origem e destino
        env:
          GAM_NETWORK_CODE: "95377733"
          GAM_SOURCE_CODES: ${{ inputs.source_codes }}
          GAM_TARGET_CODES: ${{ inputs.target_codes }}
          GAM_ALLOW_INVERTED: ${{ inputs.allow_inverted }}
        run: |
          python backend/gam_copy.py --check-direction-only

      - name: Copiar configuracoes e LICAs em lote
        env:
          GAM_NETWORK_CODE: "95377733"
          GAM_SOURCE_CODES: ${{ inputs.source_codes }}
          GAM_TARGET_CODES: ${{ inputs.target_codes }}
          GAM_REQUESTED_BY: ${{ inputs.requested_by }}
          GAM_ALLOW_INVERTED: ${{ inputs.allow_inverted }}
        run: |
          python backend/gam_copy.py
