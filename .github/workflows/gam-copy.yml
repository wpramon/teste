name: GAM Line Item Copier

run-name: "GAM Copier: ${{ inputs.source_codes }} -> ${{ inputs.target_codes }}"

on:
  workflow_dispatch:
    inputs:
      source_codes:
        description: "Códigos das linhas de ORIGEM, na ordem (ex.: 54371,54391,54411)"
        required: true
        type: string
      target_codes:
        description: "Códigos das linhas de DESTINO, mesma ordem (ex.: 54660,54330,54310)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  copiar-line-items:
    name: Copiar Line Items em lote
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gam-api-user-de-para@gam-lineitem-copier.iam.gserviceaccount.com

      - name: Copiar configuracoes e LICAs em lote
        env:
          GAM_NETWORK_CODE: "95377733"
          GAM_SOURCE_CODES: ${{ inputs.source_codes }}
          GAM_TARGET_CODES: ${{ inputs.target_codes }}
        run: |
          python backend/gam_copy.py
