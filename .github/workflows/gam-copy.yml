name: GAM Line Item Copier

on:
  workflow_dispatch:
    inputs:
      source_line_item_id:
        description: "ID do Line Item de origem"
        required: true
        type: string

      target_line_item_id:
        description: "ID do Line Item de destino"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  copiar-line-item:
    name: Copiar Line Item
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gam-api-user-de-para@gam-lineitem-copier.iam.gserviceaccount.com

      - name: Copiar configuracoes e LICAs
        env:
          GAM_NETWORK_CODE: "32352161"
          GAM_SOURCE_LINE_ITEM_ID: ${{ inputs.source_line_item_id }}
          GAM_TARGET_LINE_ITEM_ID: ${{ inputs.target_line_item_id }}
        run: |
          python backend/gam_copy.py
